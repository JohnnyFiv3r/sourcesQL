name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --all-extras
      - name: Lint
        run: uv run --frozen ruff check src tests scripts/qualify_python.py scripts/coverage_python.py
      - name: Type check
        run: uv run --frozen mypy src
      - name: Engine and Flight regressions
        run: uv run --frozen python scripts/coverage_python.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-python
          path: coverage/python/
          if-no-files-found: ignore
      - name: Python coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          totals = json.load(open("coverage/python/coverage.json"))["totals"]
          lines = round(totals["percent_statements_covered"])
          branches = round(100 * totals["covered_branches"] / totals["num_branches"])
          print(f"Python coverage: {lines}% lines, {branches}% branches. Not a gate.")
          EOF

  app:
    name: App and onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCESQL_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/research/package-lock.json
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --all-extras
          npm ci --prefix apps/research
      - name: Build and test app
        run: |
          npm run build --prefix apps/research
          npm run coverage --prefix apps/research
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-app
          path: apps/research/coverage/
          if-no-files-found: ignore
      - name: App coverage summary
        if: always()
        run: |
          {
            echo "App coverage (not a gate):"
            echo '```'
            grep -E '^TOTAL' apps/research/coverage/summary.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test hosted setup and onboarding
        run: node --test hosted/setup.test.mjs hosted/personal-cloud.test.mjs
