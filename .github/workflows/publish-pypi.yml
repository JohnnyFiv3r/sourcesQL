name: Publish Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          package = pathlib.Path("src/sourcesql/__init__.py").read_text()
          assert re.search(r'__version__ = "' + re.escape(version) + r'"', package)
          app = json.loads(pathlib.Path("apps/research/package.json").read_text())
          lock = json.loads(pathlib.Path("apps/research/package-lock.json").read_text())
          assert app["version"] == lock["version"] == lock["packages"][""]["version"] == version
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["RELEASE_TAG"] == "v" + version
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify reviewed release artifact hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, tomllib
          # Add each release only after its immutable artifacts are qualified.
          reviewed = {
              "0.2.3": {
                  "sourcesql-0.2.3-py3-none-any.whl": "13e2f14c46f60602b47651a9a6b175a79598f9afcd02db4cb9836ebec762e17a",
                  "sourcesql-0.2.3.tar.gz": "adfb5292fb6cf98e0fdbef2bd929687d28ef40dc637fe66d60efb8119deca84c",
              },
          }
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if version not in reviewed:
              raise SystemExit("Release requires reviewed immutable artifact hashes")
          expected = reviewed[version]
          if {path.name for path in Path("dist").iterdir()} != set(expected):
              raise SystemExit("Unexpected release artifact set")
          for filename, digest in expected.items():
              actual = hashlib.sha256((Path("dist") / filename).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit("Artifact hash mismatch: " + filename)
          print("Exact reviewed release hashes verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  qualify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - run: python tests/packaging/qualify_distributions.py --dist dist --report package-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-qualification-${{ matrix.python }}
          path: package-report.json

  container:
    needs: [build, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Qualify the exact Linux image
        env:
          SOURCESQL_DOCKER_APP_OUTPUT: artifacts/container-release
        run: bash scripts/qualify-docker-app.sh
      - name: Record image identity
        run: |
          docker image inspect sourcesql:app --format '{{json .}}' > artifacts/container-release/publish-image.json
          docker image inspect sourcesql:app --format '{{.Id}}' > artifacts/container-release/publish-image-id.txt
      - name: Publish the qualified image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          qualified_id="$(cat artifacts/container-release/publish-image-id.txt)"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$qualified_id" "$image:$version"
          test "$(docker image inspect "$image:$version" --format '{{.Id}}')" = "$qualified_id"
          docker push "$image:$version" | tee artifacts/container-release/push.log
          docker image inspect "$image:$version" --format '{{json .RepoDigests}}' > artifacts/container-release/published-digests.json
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-qualification
          path: artifacts/container-release/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, qualify, container]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sourcesql/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
