services:
  sourcesql:
    profiles: ["cli"]
    image: sourcesql:local
    build:
      context: .
      target: runtime
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - sourcesql-data:/data
    command: ["demo", "--profile", "fixture", "--output", "/data/demo"]

  sourcesql-app:
    image: sourcesql:app
    build:
      context: .
      target: app-runtime
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - sourcesql-app-data:/data
    environment:
      PORT: "${SOURCESQL_HTTP_PORT:-3117}"
    ports:
      - "127.0.0.1:${SOURCESQL_HTTP_PORT:-3117}:${SOURCESQL_HTTP_PORT:-3117}"
    networks:
      - sourcesql-local
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:'+process.env.PORT+'/health');if(!r.ok)process.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  sourcesql-mcp:
    profiles: ["mcp"]
    image: sourcesql:app
    build:
      context: .
      target: app-runtime
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    volumes:
      - sourcesql-app-data:/data
    command: ["--stdio"]

networks:
  sourcesql-local:
    driver: bridge

volumes:
  sourcesql-data:
  sourcesql-app-data:
