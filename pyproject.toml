[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sourcesql"
version = "0.2.3"
description = "Provider-independent SQL research with durable evidence"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["sql", "web-research", "mcp", "duckdb"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Database",
]
dependencies = ["sqlglot==30.19.0", "duckdb==1.5.0", "pyarrow==23.0.1", "pydantic==2.13.3", "httpx==0.28.1", "pydantic-ai-slim[openai]==2.27.0"]

[project.optional-dependencies]
motherduck = ["psycopg[binary]==3.3.3"]

[project.urls]
Repository = "https://github.com/JohnnyFiv3r/sourcesQL"
Documentation = "https://github.com/JohnnyFiv3r/sourcesQL/blob/main/README.md"
Issues = "https://github.com/JohnnyFiv3r/sourcesQL/issues"

[project.scripts]
sourcesql = "sourcesql.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.6", "mypy==1.19.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly configured provider qualification", "host: actual host integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/sourcesql"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "examples/",
  "fixtures/",
  "pyproject.toml",
  "uv.lock",
  "hatch_build.py",
  "README.md",
  "LICENSE",
  "NOTICE",
  "AGENTS.md",
  "provenance/reuse-manifest.json",
  "hosted/setup.mjs",
  "hosted/personal-cloud.mjs",
  "hosted/flight/*.py",
  "apps/research/package.json",
  "apps/research/package-lock.json",
  "apps/research/tsconfig.json",
  "apps/research/vercel.json",
  "apps/research/.vercelignore",
  "apps/research/index.html",
  "apps/research/research.html",
  "apps/research/api/*.ts",
  "apps/research/server/*.ts",
  "apps/research/src/*.ts",
  "apps/research/src/*.tsx",
  "apps/research/src/*.css",
  "apps/research/src/brand/*.png",
  "apps/research/src/fonts/*.woff2",
  "apps/research/src/fonts/*LICENSE.txt",
  "apps/research/src/fonts/README.md",
  "apps/research/scripts/build.ts",
